# Explicit plant data instead of the random demo factory.
# Two machines, three batches; base load and delivery profile as 24 hourly values.
bess:
  profile: large

factory:
  buffer_h: 1.0                    # setup / cooling gap between batches on a machine
  inventory_init: 0.0
  inventory_max: 1000.0
  intraday_shift_window_h: 2.0
  unmet_penalty_eur_per_unit: 5000.0
  base_load_mw: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
                 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5, 4.5,
                 3.0, 3.0, 3.0, 3.0, 3.0, 3.0]
  demand_units: [0, 0, 0, 0, 0, 0, 0, 0,
                 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25, 25]
  jobs:
    - {job_id: F1-B1, machine: F1, sequence: 0, duration_h: 3.0, power_mw: 90.0, units_out: 100}
    - {job_id: F1-B2, machine: F1, sequence: 1, duration_h: 2.5, power_mw: 80.0, units_out: 100}
    - {job_id: F2-B1, machine: F2, sequence: 0, duration_h: 4.0, power_mw: 70.0, units_out: 120,
       earliest_start_h: 0.0, latest_finish_h: 20.0}

scenarios:
  n_id_scenarios: 4
  n_rt_branches: 2

output:
  directory: results/custom_factory
