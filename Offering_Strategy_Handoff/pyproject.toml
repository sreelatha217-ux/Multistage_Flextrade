[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-multistage-offering-strategy"
version = "1.0.0"
description = "Three-stage factory scheduling with strategic energy bids, reserve offers, and CVaR risk control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "pyomo>=6.7",
    "highspy>=1.7",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
factory-mt-da = "factory_mt_da_scheduler:main"
factory-mt-id = "factory_mt_id_scheduler:main"
factory-mt-rt = "factory_mt_rt_scheduler:main"
factory-mt-offering = "factory_mt_offering_strategy:main"

[tool.setuptools]
py-modules = [
    "factory_mt_da_scheduler",
    "factory_mt_id_scheduler",
    "factory_mt_rt_scheduler",
    "factory_mt_offering_strategy",
    "factory_mt_offering_cli",
    "factory_mt_offering_plotting",
    "factory_mt_production_rescheduler",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]