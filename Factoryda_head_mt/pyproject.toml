[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-mt-da-scheduler"
version = "2.0.0"
description = "MILP day-ahead scheduling for industrial batch production with a microturbine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "pyomo>=6.7",
    "highspy>=1.7",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
factory-mt-da = "factory_mt_da_scheduler:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["factory_mt_da_scheduler", "factory_mt_da_scheduler_v2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"